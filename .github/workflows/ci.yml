name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check packages/

      - name: Format check (ruff)
        run: uv run ruff format --check packages/

      - name: Type check (mypy)
        run: |
          uv run mypy packages/app/src
          uv run mypy packages/ml_backend/src
          uv run mypy packages/mcp_server/src

      - name: Tests
        env:
          ECHOBOX_APP_LLM_API_KEY: stub
        run: uv run pytest --cov=packages --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm --prefix frontend ci

      - name: Type check + build
        run: npm --prefix frontend run build
